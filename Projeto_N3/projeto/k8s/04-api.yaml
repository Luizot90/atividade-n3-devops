apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: n3-luisotavio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: n3-catalogo:1.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: catalogo
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banco
              key: DB_PASSWORD
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /live
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: n3-luisotavio
spec:
  type: NodePort
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 31083
