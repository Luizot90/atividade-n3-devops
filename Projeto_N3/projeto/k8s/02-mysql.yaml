apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dados-mysql
  namespace: n3-luisotavio
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: n3-luisotavio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        env:
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: catalogo
              key: DB_NAME
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: catalogo
              key: DB_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banco
              key: DB_PASSWORD
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banco
              key: MYSQL_ROOT_PASSWORD
        volumeMounts:
        - name: dados
          mountPath: /var/lib/mysql
      volumes:
      - name: dados
        persistentVolumeClaim:
          claimName: dados-mysql
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: n3-luisotavio
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
